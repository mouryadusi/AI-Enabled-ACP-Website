<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Enabled Aircraft Conflict Prediction</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="A research-grade decision-support prototype using XGBoost, GCN and GAT models to anticipate loss of aircraft separation before it happens."
    />
    <meta name="theme-color" content="#FAF8F4" />
    <script>
      // Set the theme class before paint to avoid a flash of the wrong
      // palette — mirrors the logic in src/context/ThemeContext.tsx.
      // Light is the default register; only an explicit stored "dark" or a
      // system-level dark preference switches it off.
      (function () {
        try {
          var stored = localStorage.getItem("acp-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (!dark) document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-void text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
